name: Khahish Android Build

on:
  push:
    branches:
      - work/khahish-search-people-popup
  pull_request:
    branches:
      - work/consolidated-nov-2026
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    name: Compile Android app
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug
