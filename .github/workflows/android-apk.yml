name: Build Khahish APK

concurrency:
  group: khahish-android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/agora-calling
      - integration/combined-from-main
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read
  statuses: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Mark Android build pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "Khahish Android Build",
              description: "Android tests and APK build are running"
            })

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: Locate Gradle Project Directory
        run: |
          SETTINGS=$(find . -name "settings.gradle.kts" -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "Gradle project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT_DIR"

      - name: Copy updated MainActivity if present
        run: |
          if [ -f "MainActivity.kt" ]; then
            TARGET="$PROJECT_DIR/app/src/main/java/com/khahish/app"
            mkdir -p "$TARGET"
            cp MainActivity.kt "$TARGET/MainActivity.kt"
            echo "MainActivity copied successfully from root"
          else
            echo "MainActivity.kt not found in root, using existing project file."
          fi

      - name: Create Khahish App Icon if logo exists
        run: |
          python3 -m pip install pillow

          python3 - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          import os
          import re

          project = Path(os.environ["PROJECT_DIR"])
          logo = Path("khahish_logo.png")
          manifest = project / "app/src/main/AndroidManifest.xml"

          if not logo.exists():
              print("Warning: khahish_logo.png not found, skipping icon generation")
          else:
              image = Image.open(logo).convert("RGBA")
              sizes = {
                  "mipmap-mdpi": 48,
                  "mipmap-hdpi": 72,
                  "mipmap-xhdpi": 96,
                  "mipmap-xxhdpi": 144,
                  "mipmap-xxxhdpi": 192
              }

              for folder, size in sizes.items():
                  output = project / "app/src/main/res" / folder
                  output.mkdir(parents=True, exist_ok=True)

                  icon = ImageOps.fit(
                      image,
                      (size, size),
                      method=Image.Resampling.LANCZOS
                  )

                  icon.save(output / "khahish_launcher.png")
                  icon.save(output / "khahish_launcher_round.png")

              drawable = project / "app/src/main/res/drawable-nodpi"
              drawable.mkdir(parents=True, exist_ok=True)
              image.save(drawable / "khahish_logo.png")

              if manifest.exists():
                  content = manifest.read_text()
                  match = re.search(r'<application\b[^>]*>', content)

                  if match:
                      tag = match.group(0)
                      for attribute, value in [
                          ("android:icon", "@mipmap/khahish_launcher"),
                          ("android:roundIcon", "@mipmap/khahish_launcher_round")
                      ]:
                          pattern = rf'{attribute}="[^"]*"'
                          if re.search(pattern, tag):
                              tag = re.sub(pattern, f'{attribute}="{value}"', tag)
                          else:
                              tag = tag[:-1] + f' {attribute}="{value}">'

                      content = content[:match.start()] + tag + content[match.end():]
                      manifest.write_text(content)

          if manifest.exists():
              content = manifest.read_text()
              if "android.permission.INTERNET" not in content:
                  content = content.replace(
                      '<application',
                      '<uses-permission android:name="android.permission.INTERNET" />\n    <application',
                      1
                  )
                  manifest.write_text(content)

          print("Icon and Internet permission check completed")
          PY

      - name: Place Firebase config
        run: |
          if [ -f "google-services.json" ]; then
            cp google-services.json "$PROJECT_DIR/app/google-services.json"
            echo "Firebase config placed from root"
          else
            echo "google-services.json already in project or missing"
          fi

      - name: Verify project build configuration
        run: |
          cd "$PROJECT_DIR"
          test -f app/google-services.json || { echo "Missing app/google-services.json"; exit 1; }
          grep -q 'id("com.google.gms.google-services")' app/build.gradle.kts
          grep -q 'com.google.firebase:firebase-bom' app/build.gradle.kts
          grep -q 'io.coil-kt:coil-compose' app/build.gradle.kts
          echo "Using the project's committed Android, Kotlin and Firebase versions without rewriting them."

      - name: Build Khahish APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Run Android Keystore instrumentation tests
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          script: |
            cd "$PROJECT_DIR"
            gradle :app:connectedDebugAndroidTest --stacktrace; TEST_EXIT=$?; adb logcat -d -v threadtime > "$PROJECT_DIR/keystore-instrumentation-logcat.txt" || true; exit $TEST_EXIT

      - name: Upload Keystore test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Khahish-Keystore-Test-Diagnostics
          path: |
            ${{ env.PROJECT_DIR }}/keystore-instrumentation-logcat.txt
            ${{ env.PROJECT_DIR }}/app/build/reports/androidTests/connected/debug/
          if-no-files-found: ignore


      # NEW STEP: Print SHA-1 and SHA-256 fingerprints
      - name: Show Android SHA fingerprints
        run: |
          cd "$PROJECT_DIR"
          gradle :app:signingReport

      - name: Upload Khahish APK
        uses: actions/upload-artifact@v4
        with:
          name: Khahish-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Mark Android build successful
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "success",
              context: "Khahish Android Build",
              description: "Instrumentation tests and APK build passed"
            })

      - name: Mark Android build failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "failure",
              context: "Khahish Android Build",
              description: "Android tests or APK build failed"
            })
