name: Firestore Rules Tests

concurrency:
  group: khahish-firestore-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main, work/consolidated-nov-2026]
    paths:
      - "firestore.rules"
      - "firestore.indexes.json"
      - "firebase.json"
      - "tests/**"
      - "package.json"
      - ".github/workflows/firestore-rules.yml"
  push:
    branches: [feature/agora-calling, work/khahish-consolidated-final]
    paths:
      - "firestore.rules"
      - "firestore.indexes.json"
      - "firebase.json"
      - "tests/**"
      - "package.json"
      - ".github/workflows/firestore-rules.yml"

jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Run Firestore emulator security tests
        run: npm run test:rules
